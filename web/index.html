<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>远程协助</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="icon-status" viewBox="0 0 24 24"><path d="M4 13h4l2-7 4 12 2-5h4" /></symbol>
      <symbol id="icon-control" viewBox="0 0 24 24"><path d="M4 7h10" /><path d="M18 7h2" /><path d="M4 17h2" /><path d="M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></symbol>
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="M15 6 9 12l6 6" /></symbol>
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="m4 11 8-7 8 7" /><path d="M6 10v9h12v-9" /></symbol>
      <symbol id="icon-recents" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" /><path d="M4 13V6a2 2 0 0 1 2-2h7" /></symbol>
      <symbol id="icon-permission" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 3.5 8 7 10 3.5-2 7-5 7-10V6l-7-3Z" /><path d="m9 12 2 2 4-5" /></symbol>
      <symbol id="icon-touch" viewBox="0 0 24 24"><path d="M8 11V6a2 2 0 1 1 4 0v5" /><path d="M12 10V8a2 2 0 1 1 4 0v6" /><path d="M8 11a2 2 0 0 0-4 0v2c0 5 3 8 8 8h1a5 5 0 0 0 5-5v-2" /></symbol>
      <symbol id="icon-trackpad" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3" /><path d="M4 14h16" /><path d="M12 14v5" /></symbol>
    </svg>
    <main class="app-shell">
      <section class="stage" aria-label="远程屏幕">
        <video id="screen" autoplay playsinline muted></video>
        <div id="touch-layer" aria-hidden="true"></div>
      </section>

      <section id="status-panel" class="status-panel" aria-label="状态信息">
        <button id="status-handle" class="panel-handle icon-button" type="button" aria-label="状态" aria-expanded="true">
          <svg class="icon" aria-hidden="true"><use href="#icon-status"></use></svg>
        </button>
        <div class="status-body">
          <div class="status-row"><span aria-label="状态">状态：</span><strong id="status">等待安卓端连接</strong></div>
          <div class="status-row"><span aria-label="输入">输入：</span><strong id="control-status">--</strong></div>
          <div class="status-row"><span aria-label="延时">延时：</span><strong id="latency">RTT -- ms</strong></div>
          <div class="status-row"><span aria-label="线路">线路：</span><strong id="route-mode">--</strong></div>
          <div class="status-row detail-row"><span aria-label="候选">候选：</span><strong id="route-detail">--</strong></div>
        </div>
      </section>

      <section id="control-float" class="control-float is-collapsed" aria-label="远程控制">
        <button id="control-float-button" class="control-ball icon-button" type="button" aria-label="控制" aria-expanded="false">
          <svg class="icon" aria-hidden="true"><use href="#icon-control"></use></svg>
        </button>
        <div id="control-panel" class="control-panel">
          <div class="control-group" role="group" aria-label="系统导航">
            <button class="remote-action icon-button" type="button" data-action="back" aria-label="返回"><svg class="icon" aria-hidden="true"><use href="#icon-back"></use></svg></button>
            <button class="remote-action icon-button" type="button" data-action="home" aria-label="主页"><svg class="icon" aria-hidden="true"><use href="#icon-home"></use></svg></button>
            <button class="remote-action icon-button" type="button" data-action="recents" aria-label="后台"><svg class="icon" aria-hidden="true"><use href="#icon-recents"></use></svg></button>
          </div>
          <button id="control-permission" class="permission-action icon-button" type="button" aria-label="申请控制权限"><svg class="icon" aria-hidden="true"><use href="#icon-permission"></use></svg>申请控制</button>
          <div class="control-group" role="group" aria-label="输入模式">
            <button class="mode-option icon-button active" type="button" data-mode="direct" aria-label="触控"><svg class="icon" aria-hidden="true"><use href="#icon-touch"></use></svg></button>
            <button class="mode-option icon-button" type="button" data-mode="trackpad" aria-label="触控板"><svg class="icon" aria-hidden="true"><use href="#icon-trackpad"></use></svg></button>
          </div>
          <div class="control-group quality-group" role="group" aria-label="画质模式">
            <button class="quality-option" type="button" data-quality="quality">画质</button>
            <button class="quality-option active" type="button" data-quality="balanced">均衡</button>
            <button class="quality-option" type="button" data-quality="speed">速度</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/viewer.js"></script>
  </body>
</html>
