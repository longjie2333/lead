name: Go Cross Build
description: Build and package a Go binary for one target platform.

inputs:
  go-version:
    description: Go version passed to actions/setup-go. Leave empty to use go-version-file or an already configured Go toolchain.
    required: false
    default: ""
  go-version-file:
    description: go.mod or go.work path passed to actions/setup-go when go-version is empty.
    required: false
    default: ""
  cache-dependency-path:
    description: Dependency file path passed to actions/setup-go cache configuration, such as go.sum.
    required: false
    default: ""
  working-directory:
    description: Directory where go build runs. Relative paths are resolved from the repository root.
    required: false
    default: "."
  package:
    description: Go package path to build, for example ./cmd/server.
    required: false
    default: "."
  binary-name:
    description: Output binary name. Defaults to the repository name.
    required: false
    default: ""
  goos:
    description: Target GOOS, for example linux, windows, darwin.
    required: true
  goarch:
    description: Target GOARCH, for example amd64, arm64, arm.
    required: true
  goamd64:
    description: Optional GOAMD64 value, such as v1, v2, v3, v4.
    required: false
    default: ""
  goarm:
    description: Optional GOARM value, such as 5, 6, 7.
    required: false
    default: ""
  gomips:
    description: Optional GOMIPS value, such as hardfloat or softfloat.
    required: false
    default: ""
  cgo-enabled:
    description: CGO_ENABLED value.
    required: false
    default: "0"
  cc:
    description: Optional C compiler to export as CC when cgo-enabled is 1.
    required: false
    default: ""
  build-tags:
    description: Optional Go build tags passed through -tags.
    required: false
    default: ""
  build-flags:
    description: Additional arguments appended to go build, for example "-v -race".
    required: false
    default: ""
  ldflags:
    description: Values passed through go build -ldflags.
    required: false
    default: ""
  trimpath:
    description: Whether to pass -trimpath to go build.
    required: false
    default: "true"
  skip-checks:
    description: Whether to skip pre-build gofmt and go test checks.
    required: false
    default: "true"
  output-dir:
    description: Directory for generated artifacts. Relative paths are resolved from the repository root.
    required: false
    default: "dist"
  package-name:
    description: Archive or staging directory name. Defaults to binary-name-goos-goarch plus architecture variant when provided.
    required: false
    default: ""
  package-format:
    description: Packaging format. Supported values are auto, zip, tar.gz, tar, none.
    required: false
    default: "auto"
  extra-files:
    description: Space or newline separated files/directories copied into the package. Relative paths are resolved from working-directory.
    required: false
    default: ""
  checksum:
    description: Checksum files to generate. Supported values are sha256, md5, both, none.
    required: false
    default: "sha256"
  pre-build-command:
    description: Optional shell command executed in working-directory before go build.
    required: false
    default: ""
  post-build-command:
    description: Optional shell command executed after packaging. Artifact paths are available in environment variables.
    required: false
    default: ""

outputs:
  artifact-name:
    description: Artifact base name without checksum extension.
    value: ${{ steps.build.outputs.artifact-name }}
  artifact-path:
    description: Path to the generated archive, or to the staging directory when package-format is none.
    value: ${{ steps.build.outputs.artifact-path }}
  artifact-dir:
    description: Path to the staging directory containing the built binary and extra files.
    value: ${{ steps.build.outputs.artifact-dir }}
  binary-path:
    description: Path to the generated binary inside the staging directory.
    value: ${{ steps.build.outputs.binary-path }}
  sha256-path:
    description: Path to the generated .sha256 file when enabled.
    value: ${{ steps.build.outputs.sha256-path }}
  md5-path:
    description: Path to the generated .md5 file when enabled.
    value: ${{ steps.build.outputs.md5-path }}

runs:
  using: composite
  steps:
    - name: Set up Go by version
      if: ${{ inputs.go-version != '' }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Set up Go by version file
      if: ${{ inputs.go-version == '' && inputs.go-version-file != '' }}
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Build and package
      id: build
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_BINARY_NAME: ${{ inputs.binary-name }}
        INPUT_GOOS: ${{ inputs.goos }}
        INPUT_GOARCH: ${{ inputs.goarch }}
        INPUT_GOAMD64: ${{ inputs.goamd64 }}
        INPUT_GOARM: ${{ inputs.goarm }}
        INPUT_GOMIPS: ${{ inputs.gomips }}
        INPUT_CGO_ENABLED: ${{ inputs.cgo-enabled }}
        INPUT_CC: ${{ inputs.cc }}
        INPUT_BUILD_TAGS: ${{ inputs.build-tags }}
        INPUT_BUILD_FLAGS: ${{ inputs.build-flags }}
        INPUT_LDFLAGS: ${{ inputs.ldflags }}
        INPUT_TRIMPATH: ${{ inputs.trimpath }}
        INPUT_SKIP_CHECKS: ${{ inputs.skip-checks }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_PACKAGE_NAME: ${{ inputs.package-name }}
        INPUT_PACKAGE_FORMAT: ${{ inputs.package-format }}
        INPUT_EXTRA_FILES: ${{ inputs.extra-files }}
        INPUT_CHECKSUM: ${{ inputs.checksum }}
        INPUT_PRE_BUILD_COMMAND: ${{ inputs.pre-build-command }}
        INPUT_POST_BUILD_COMMAND: ${{ inputs.post-build-command }}
      run: |
        set -euo pipefail

        lower() {
          printf '%s' "$1" | tr '[:upper:]' '[:lower:]'
        }

        truthy() {
          case "$(lower "$1")" in
            1|true|yes|on) return 0 ;;
            *) return 1 ;;
          esac
        }

        resolve_from_workspace() {
          local path="$1"
          if [[ "$path" = /* ]]; then
            printf '%s\n' "$path"
          else
            printf '%s\n' "${GITHUB_WORKSPACE}/${path}"
          fi
        }

        resolve_from_workdir() {
          local path="$1"
          if [[ "$path" = /* ]]; then
            printf '%s\n' "$path"
          else
            printf '%s\n' "${workdir}/${path}"
          fi
        }

        INPUT_WORKING_DIRECTORY="${INPUT_WORKING_DIRECTORY:-.}"
        INPUT_PACKAGE="${INPUT_PACKAGE:-.}"
        INPUT_BINARY_NAME="${INPUT_BINARY_NAME:-}"
        INPUT_GOAMD64="${INPUT_GOAMD64:-}"
        INPUT_GOARM="${INPUT_GOARM:-}"
        INPUT_GOMIPS="${INPUT_GOMIPS:-}"
        INPUT_CGO_ENABLED="${INPUT_CGO_ENABLED:-0}"
        INPUT_CC="${INPUT_CC:-}"
        INPUT_BUILD_TAGS="${INPUT_BUILD_TAGS:-}"
        INPUT_BUILD_FLAGS="${INPUT_BUILD_FLAGS:-}"
        INPUT_LDFLAGS="${INPUT_LDFLAGS:-}"
        INPUT_TRIMPATH="${INPUT_TRIMPATH:-true}"
        INPUT_SKIP_CHECKS="${INPUT_SKIP_CHECKS:-false}"
        INPUT_OUTPUT_DIR="${INPUT_OUTPUT_DIR:-dist}"
        INPUT_PACKAGE_NAME="${INPUT_PACKAGE_NAME:-}"
        INPUT_PACKAGE_FORMAT="${INPUT_PACKAGE_FORMAT:-auto}"
        INPUT_EXTRA_FILES="${INPUT_EXTRA_FILES:-}"
        INPUT_CHECKSUM="${INPUT_CHECKSUM:-sha256}"
        INPUT_PRE_BUILD_COMMAND="${INPUT_PRE_BUILD_COMMAND:-}"
        INPUT_POST_BUILD_COMMAND="${INPUT_POST_BUILD_COMMAND:-}"

        workdir="$(resolve_from_workspace "$INPUT_WORKING_DIRECTORY")"
        output_dir="$(resolve_from_workspace "$INPUT_OUTPUT_DIR")"

        binary_name="$INPUT_BINARY_NAME"
        if [[ -z "$binary_name" ]]; then
          binary_name="$(basename "${GITHUB_REPOSITORY}")"
        fi

        variant=""
        if [[ -n "$INPUT_GOAMD64" && "$INPUT_GOARCH" == "amd64" ]]; then
          variant="-${INPUT_GOAMD64}"
        elif [[ -n "$INPUT_GOARM" && "$INPUT_GOARCH" == "arm" ]]; then
          variant="v${INPUT_GOARM}"
        elif [[ -n "$INPUT_GOMIPS" && "$INPUT_GOARCH" == *"mips"* ]]; then
          variant="-${INPUT_GOMIPS}"
        fi

        package_name="$INPUT_PACKAGE_NAME"
        if [[ -z "$package_name" ]]; then
          package_name="${binary_name}-${INPUT_GOOS}-${INPUT_GOARCH}${variant}"
        fi

        ext=""
        if [[ "$INPUT_GOOS" == "windows" ]]; then
          ext=".exe"
        fi

        mkdir -p "$output_dir"
        stage_root="${output_dir}/.staging"
        stage_dir="${stage_root}/${package_name}"
        rm -rf "$stage_dir"
        mkdir -p "$stage_dir"

        binary_path="${stage_dir}/${binary_name}${ext}"

        cd "$workdir"

        if ! truthy "$INPUT_SKIP_CHECKS"; then
          echo "Checking Go formatting"
          unformatted_files="$(gofmt -l .)"
          if [[ -n "$unformatted_files" ]]; then
            echo "$unformatted_files"
            exit 1
          fi

          test_args=(test)
          if [[ -n "$INPUT_BUILD_TAGS" ]]; then
            test_args+=(-tags "$INPUT_BUILD_TAGS")
          fi
          test_args+=(./...)

          echo "Running Go tests"
          (
            unset GOOS GOARCH GOAMD64 GOARM GOMIPS CC
            go "${test_args[@]}"
          )
        fi

        export GOOS="$INPUT_GOOS"
        export GOARCH="$INPUT_GOARCH"
        export CGO_ENABLED="$INPUT_CGO_ENABLED"
        if [[ -n "$INPUT_GOAMD64" ]]; then export GOAMD64="$INPUT_GOAMD64"; fi
        if [[ -n "$INPUT_GOARM" ]]; then export GOARM="$INPUT_GOARM"; fi
        if [[ -n "$INPUT_GOMIPS" ]]; then export GOMIPS="$INPUT_GOMIPS"; fi
        if [[ -n "$INPUT_CC" ]]; then export CC="$INPUT_CC"; fi

        if [[ -n "$INPUT_PRE_BUILD_COMMAND" ]]; then
          eval "$INPUT_PRE_BUILD_COMMAND"
        fi

        build_args=(build -o "$binary_path")
        if truthy "$INPUT_TRIMPATH"; then
          build_args+=(-trimpath)
        fi
        if [[ -n "$INPUT_BUILD_TAGS" ]]; then
          build_args+=(-tags "$INPUT_BUILD_TAGS")
        fi
        if [[ -n "$INPUT_BUILD_FLAGS" ]]; then
          eval "extra_build_flags=($INPUT_BUILD_FLAGS)"
          build_args+=("${extra_build_flags[@]}")
        fi
        if [[ -n "$INPUT_LDFLAGS" ]]; then
          build_args+=(-ldflags "$INPUT_LDFLAGS")
        fi
        build_args+=("$INPUT_PACKAGE")

        echo "Building ${binary_name} for ${GOOS}/${GOARCH}"
        go "${build_args[@]}"

        if [[ -n "$INPUT_EXTRA_FILES" ]]; then
          while IFS= read -r extra_file; do
            [[ -z "$extra_file" ]] && continue
            source_path="$(resolve_from_workdir "$extra_file")"
            if [[ ! -e "$source_path" ]]; then
              echo "Extra file does not exist: ${extra_file}" >&2
              exit 1
            fi
            cp -R "$source_path" "$stage_dir/"
          done < <(printf '%s\n' $INPUT_EXTRA_FILES)
        fi

        package_format="$(lower "$INPUT_PACKAGE_FORMAT")"
        artifact_name="$package_name"
        artifact_path=""

        case "$package_format" in
          auto)
            if [[ "$INPUT_GOOS" == "windows" ]]; then
              package_format="zip"
            else
              package_format="tar.gz"
            fi
            ;;
          tgz)
            package_format="tar.gz"
            ;;
          off|false|raw)
            package_format="none"
            ;;
        esac

        case "$package_format" in
          zip)
            artifact_name="${package_name}.zip"
            artifact_path="${output_dir}/${artifact_name}"
            rm -f "$artifact_path"
            (cd "$stage_root" && zip -qr "$artifact_path" "$package_name")
            ;;
          tar.gz)
            artifact_name="${package_name}.tar.gz"
            artifact_path="${output_dir}/${artifact_name}"
            rm -f "$artifact_path"
            (cd "$stage_root" && tar -czf "$artifact_path" "$package_name")
            ;;
          tar)
            artifact_name="${package_name}.tar"
            artifact_path="${output_dir}/${artifact_name}"
            rm -f "$artifact_path"
            (cd "$stage_root" && tar -cf "$artifact_path" "$package_name")
            ;;
          none)
            artifact_path="$stage_dir"
            ;;
          *)
            echo "Unsupported package-format: ${INPUT_PACKAGE_FORMAT}" >&2
            exit 1
            ;;
        esac

        checksum_target="$artifact_path"
        if [[ ! -f "$checksum_target" ]]; then
          checksum_target="$binary_path"
        fi

        checksum_mode="$(lower "$INPUT_CHECKSUM")"
        sha256_path=""
        md5_path=""
        case "$checksum_mode" in
          sha256)
            sha256_path="${checksum_target}.sha256"
            (cd "$(dirname "$checksum_target")" && sha256sum "$(basename "$checksum_target")" > "$sha256_path")
            ;;
          md5)
            md5_path="${checksum_target}.md5"
            (cd "$(dirname "$checksum_target")" && md5sum "$(basename "$checksum_target")" > "$md5_path")
            ;;
          both)
            sha256_path="${checksum_target}.sha256"
            md5_path="${checksum_target}.md5"
            (cd "$(dirname "$checksum_target")" && sha256sum "$(basename "$checksum_target")" > "$sha256_path")
            (cd "$(dirname "$checksum_target")" && md5sum "$(basename "$checksum_target")" > "$md5_path")
            ;;
          none|off|false)
            ;;
          *)
            echo "Unsupported checksum: ${INPUT_CHECKSUM}" >&2
            exit 1
            ;;
        esac

        export GO_CROSS_BUILD_ARTIFACT_NAME="$artifact_name"
        export GO_CROSS_BUILD_ARTIFACT_PATH="$artifact_path"
        export GO_CROSS_BUILD_ARTIFACT_DIR="$stage_dir"
        export GO_CROSS_BUILD_BINARY_PATH="$binary_path"
        export GO_CROSS_BUILD_SHA256_PATH="$sha256_path"
        export GO_CROSS_BUILD_MD5_PATH="$md5_path"

        if [[ -n "$INPUT_POST_BUILD_COMMAND" ]]; then
          eval "$INPUT_POST_BUILD_COMMAND"
        fi

        {
          echo "artifact-name=${artifact_name}"
          echo "artifact-path=${artifact_path}"
          echo "artifact-dir=${stage_dir}"
          echo "binary-path=${binary_path}"
          echo "sha256-path=${sha256_path}"
          echo "md5-path=${md5_path}"
        } >> "$GITHUB_OUTPUT"
