name: Backend

on:
  pull_request:
    branches:
      - dev
      - main
      - master
  push:
    branches:
      - dev
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GO_VERSION_FILE: server/go.mod
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/lead-server

jobs:
  backend:
    name: Test and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install C toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-x86-64-linux-gnu \
            gcc-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64 \
            libc6-dev \
            libc6-dev-arm64-cross \
            zip

      - name: Verify C toolchains
        run: |
          printf '#include <stdlib.h>\nint main(void) { return 0; }\n' | x86_64-linux-gnu-gcc -x c -o /tmp/check-linux-amd64 -
          printf '#include <stdlib.h>\nint main(void) { return 0; }\n' | aarch64-linux-gnu-gcc -x c -o /tmp/check-linux-arm64 -
          printf '#include <stdlib.h>\nint main(void) { return 0; }\n' | x86_64-w64-mingw32-gcc -x c -o /tmp/check-windows-amd64.exe -

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Check viewer script
        run: node --check public/viewer.js

      - name: Build backend binary packages
        run: |
          mkdir -p ../dist/server

          build_package() {
            os="$1"
            arch="$2"
            cc="$3"
            ext="$4"
            archive_type="$5"
            package="lead-server-${os}-${arch}"
            package_dir="../dist/server/${package}"

            mkdir -p "$package_dir"
            echo "Building ${package} with ${cc}"
            CGO_ENABLED=1 GOOS="$os" GOARCH="$arch" CC="$cc" \
              go build -trimpath -ldflags="-s -w" -o "${package_dir}/lead-server${ext}" ./cmd/server
            cp -R public "$package_dir/public"

            if [ "$archive_type" = "zip" ]; then
              (cd ../dist/server && zip -qr "${package}.zip" "$package")
            else
              (cd ../dist/server && tar -czf "${package}.tar.gz" "$package")
            fi
            rm -rf "$package_dir"
          }

          build_package linux amd64 x86_64-linux-gnu-gcc "" tar
          build_package linux arm64 aarch64-linux-gnu-gcc "" tar
          build_package windows amd64 x86_64-w64-mingw32-gcc ".exe" zip

          (
            cd ../dist/server
            find . -maxdepth 1 -type f \( -name "*.tar.gz" -o -name "*.zip" \) -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload dev backend artifact
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: lead-server-dev-binaries
          path: dist/server/*
          if-no-files-found: error

      - name: Upload release backend artifact
        if: github.ref != 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: lead-server-release-binaries
          path: dist/server/*
          if-no-files-found: error

  backend-image:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/dev' }}
            type=ref,event=tag
            type=sha,prefix=sha-,enable=${{ github.ref != 'refs/heads/dev' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - backend
      - backend-image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: lead-server-release-binaries
          path: dist/server

      - name: Publish backend artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/server/* --clobber
