name: Backend

on:
  pull_request:
    branches:
      - dev
      - main
      - master
  push:
    branches:
      - dev
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: x86_64-linux-gnu-gcc
            apt-packages: build-essential gcc-x86-64-linux-gnu libc6-dev
            verify-output: /tmp/check-linux-amd64
            skip-checks: "false"
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            apt-packages: build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            verify-output: /tmp/check-linux-arm64
          - goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            apt-packages: gcc-mingw-w64-x86-64 zip
            verify-output: /tmp/check-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web assets
        uses: ./.github/actions/web-build

      - id: version
        name: Resolve Backend version
        shell: bash
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            version_name="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version-name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Install C toolchain
        env:
          APT_PACKAGES: ${{ matrix.apt-packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Verify C toolchain
        run: |
          printf '#include <stdlib.h>\nint main(void) { return 0; }\n' \
            | ${{ matrix.cc }} -x c -o "${{ matrix.verify-output }}" -

      - id: build
        name: Build package
        uses: ./.github/actions/go-cross-build/
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
          working-directory: server
          package: ./cmd/server
          binary-name: lead-server
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          cgo-enabled: "1"
          cc: ${{ matrix.cc }}
          ldflags: "-s -w"
          skip-checks: ${{ matrix.skip-checks }}
          output-dir: dist/server
          package-name: lead-server-${{ steps.version.outputs.version-name }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref == 'refs/heads/dev' && 'dev' || 'release' }}
          extra-files: public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: |
            ${{ steps.build.outputs.artifact-path }}
            ${{ steps.build.outputs.sha256-path }}
          if-no-files-found: error

  backend-image:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web assets
        uses: ./.github/actions/web-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lead-server
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/dev' }}
            type=ref,event=tag
            type=sha,prefix=sha-,enable=${{ github.ref != 'refs/heads/dev' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - backend
      - backend-image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lead-server-*
          path: dist/server
          merge-multiple: true

      - name: Publish backend artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/server/* --clobber
