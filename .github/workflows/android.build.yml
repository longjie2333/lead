name: Android

on:
  pull_request:
    branches:
      - dev
      - main
      - master
  push:
    branches:
      - dev
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: version
        name: Resolve Android version
        shell: bash
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            version_name="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version-name=$version_name" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build Android artifacts
        uses: ./.github/actions/android-build
        with:
          working-directory: app
          java-version: 17
          gradle-tasks: |
            testReleaseUnitTest
            lintRelease
            assembleRelease
            bundleRelease
          project-properties: |
            screenShareServerUrl=${{ vars.ANDROID_SERVER_URL }}
          version-code: ${{ github.run_number }}
          version-name: ${{ steps.version.outputs.version-name }}
          artifact-name: lead-android-${{ steps.version.outputs.version-name }}-${{ github.ref == 'refs/heads/dev' && 'dev' || 'release' }}
          signing-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          signing-store-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          signing-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          signing-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: ${{ steps.build.outputs.apk-dir }}/*.apk
          if-no-files-found: error

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: ${{ steps.build.outputs.aab-dir }}/*.aab
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lead-android-*
          path: dist/android
          merge-multiple: true

      - name: Publish Android artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/android/* --clobber
